name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: NativeAOT publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      # Uniform, cacheable package location across all three runner OSes.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The restore is dominated by the NativeAOT toolchain — the ILCompiler and
      # runtime packs are ~570 MB per RID and were re-downloaded every run.
      # Cache them so only the first run (or a toolchain bump) pays that cost.
      - name: Cache NuGet packages (incl. the NativeAOT toolchain)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget-packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
      - name: NativeAOT publish
        run: dotnet publish src -c Release -r ${{ matrix.rid }}
      - name: Show the produced native binary
        shell: bash
        run: ls -lh src/bin/Release/net10.0/${{ matrix.rid }}/publish/

  shellcheck:
    name: ShellCheck (install/uninstall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .

  syntax-unix:
    name: Bash syntax (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check the install scripts
        shell: bash
        run: |
          echo "Using bash: $(bash --version | head -1)"
          bash -n install.sh
          bash -n uninstall.sh
          echo "Scripts parse cleanly."
