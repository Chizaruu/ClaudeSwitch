name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Compile ClaudeRouter (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with the in-box C# compiler
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (-not (Test-Path $csc)) {
            Write-Error "C# compiler not found on runner"; exit 1
          }
          & $csc /nologo /target:winexe /out:ClaudeRouter.exe `
            /reference:System.Management.dll /reference:System.Windows.Forms.dll `
            src\ClaudeRouter.cs
          if (-not (Test-Path ClaudeRouter.exe)) {
            Write-Error "Build failed: ClaudeRouter.exe not produced"; exit 1
          }
          Write-Host "Build succeeded."

  shellcheck-unix:
    name: ShellCheck (Unix engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          # Lints src/claude-router.sh plus install.sh / uninstall.sh at the root.
          scandir: .

  syntax-unix:
    name: Bash syntax (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check every shell script
        shell: bash
        run: |
          echo "Using bash: $(bash --version | head -1)"
          bash -n src/claude-router.sh
          bash -n install.sh
          bash -n uninstall.sh
          echo "All scripts parse cleanly."
